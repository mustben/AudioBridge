name: Prepare draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed tag, for example v0.3.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  draft:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      # Manual input stays in an environment variable, never interpolated into shell code.
      # Validate before using the selected ref in checkout.
      - name: Validate tag syntax
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?$') {
            throw 'Invalid release tag'
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Validate package version
        shell: pwsh
        run: |
          $meta = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Metadata failed' }
          $version = ($meta.packages | Where-Object name -eq 'audio-bridge').version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag and package version differ' }
      - name: Verify
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed' }
          cargo test --locked --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed' }
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Create draft prerelease only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $assets = @(Get-ChildItem dist/AudioBridge-v*-windows-x64.zip).FullName
          if ($assets.Count -ne 1) { throw 'Expected one release archive' }
          gh release create "$env:RELEASE_TAG" $assets dist/SHA256SUMS.txt --verify-tag --draft --prerelease --title "AudioBridge $env:RELEASE_TAG" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
