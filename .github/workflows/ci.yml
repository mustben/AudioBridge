name: Windows CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        shell: pwsh
        run: |
          rustup show
          rustc --version
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Headless-safe tests
        run: cargo test --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Dependency license consistency
        shell: pwsh
        run: |
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { throw 'Dependency fetch failed' }
          python scripts/test_export_licenses.py
          if ($LASTEXITCODE -ne 0) { throw 'License policy tests failed' }
          python scripts/export_licenses.py
          if ($LASTEXITCODE -ne 0) { throw 'License export failed' }
          $changes = git status --porcelain -- THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES
          if ($LASTEXITCODE -ne 0 -or $changes) { throw 'Committed dependency licenses are stale' }
      - name: Build and package
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AudioBridge-windows-x64
          path: |
            dist/AudioBridge-v*-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
